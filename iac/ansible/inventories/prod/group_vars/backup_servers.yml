---
# ZFS-пул backups: 12 дисков 16–20 ТБ NL-SAS (docs/04).
# ЗАПОЛНИТЬ ПО /dev/disk/by-id (ls -l /dev/disk/by-id/ на pbs-01) — НЕ по sdX, они плавают!
pbs_zfs_devices:
  - /dev/disk/by-id/ata-HDD01-CHANGE-ME
  - /dev/disk/by-id/ata-HDD02-CHANGE-ME
  - /dev/disk/by-id/ata-HDD03-CHANGE-ME
  - /dev/disk/by-id/ata-HDD04-CHANGE-ME
  - /dev/disk/by-id/ata-HDD05-CHANGE-ME
  - /dev/disk/by-id/ata-HDD06-CHANGE-ME
  - /dev/disk/by-id/ata-HDD07-CHANGE-ME
  - /dev/disk/by-id/ata-HDD08-CHANGE-ME
  - /dev/disk/by-id/ata-HDD09-CHANGE-ME
  - /dev/disk/by-id/ata-HDD10-CHANGE-ME
  - /dev/disk/by-id/ata-HDD11-CHANGE-ME
  - /dev/disk/by-id/ata-HDD12-CHANGE-ME

# Вторая копия в Yandex Cloud S3 (Object Lock бакет, 3-2-1).
# Ключи — из OpenBao/env, НЕ коммитить реальные значения:
#   export PBS_S3_ACCESS_KEY=... PBS_S3_SECRET_KEY=...
pbs_s3_endpoint: https://storage.yandexcloud.net
pbs_s3_bucket: crm-backups-offsite
pbs_s3_access_key: "{{ lookup('env', 'PBS_S3_ACCESS_KEY') | default('') }}"
pbs_s3_secret_key: "{{ lookup('env', 'PBS_S3_SECRET_KEY') | default('') }}"
