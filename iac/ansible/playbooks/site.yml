---
# Полная сборка инфраструктуры (docs/11-rollout.md, этапы 3–4; порядок — iac/docs/RUNBOOK.md)
- name: Базовая настройка всех хостов
  hosts: all
  roles:
    - common

- name: Кластер Proxmox + Ceph
  hosts: proxmox_nodes
  roles:
    - proxmox_node
    - ceph   # пулы + проверка здоровья; запускать после proxmox-cluster.yml (OSD созданы)

- name: Мониторинг
  hosts: zabbix-01
  roles:
    - zabbix_server

- name: SSO (поднимается первым из сервисов — docs/16)
  hosts: keycloak-01
  roles:
    - keycloak

- name: ITAM/Helpdesk
  hosts: glpi-01
  roles:
    - glpi

- name: Файлы + OnlyOffice
  hosts: nextcloud-01
  roles:
    - nextcloud

- name: Телефония (MikoPBX, актив/резерв)
  hosts: mikopbx
  roles:
    - mikopbx

- name: Рабочие места Linux (через ansible-pull, справочно)
  hosts: linux_desktops
  gather_facts: false
  roles:
    - linux_desktop
