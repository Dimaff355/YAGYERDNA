# =====================================================================
# crm-core-01 — Huawei S6730-H24X6C — iStack MASTER (member 1)
# Ядро сети офиса CRM. 24x10G SFP+ + 6x100G QSFP28.
# Пары: core-02.cfg (member 2). Конфиг ПОСЛЕ образования iStack общий —
# заливать на master; различается только секция iStack ниже.
# VRP V200R022+. Все пароли — плейсхолдеры, заменить при заливке.
# =====================================================================

# ---------------------------------------------------------------------
# СЕКЦИЯ 1. iStack — ВЫПОЛНЯЕТСЯ НА ИЗОЛИРОВАННОМ core-01 ДО СБОРКИ СТЕКА
# ---------------------------------------------------------------------
# ВНИМАНИЕ: после этих команд свитч перезагружается.
system-view
sysname crm-core-stack            # имя общее для стека (унаследуется)
#
stack
 stack member 1 priority 150      # выше приоритет -> Master
 stack member 1 domain 10         # domain одинаковый на обоих
quit
# Stack-порты: 2x100G на каждом ядре, кросс-соединение с member 2
interface stack-port 1/1
 port member-group interface 100ge 1/0/5 to 1/0/6
quit
save
y
# reboot -> y  (после этого соединить 100GE1/0/5-6 с 100GE2/0/5-6)

# =====================================================================
# СЕКЦИЯ 2. ОБЩИЙ КОНФИГ СТЕКА (заливается на master после display stack)
# =====================================================================
system-view
sysname crm-core-stack

# ---------- VLAN ----------
vlan batch 10 20 30 40 41 50 60 70 80 90 998 999
#
vlan 10
 description MGMT
vlan 20
 description USERS
vlan 30
 description VOICE
vlan 40
 description WIFI-CORP
vlan 41
 description WIFI-GUEST
vlan 50
 description SERVERS-INFRA
vlan 60
 description SERVERS-DEV
vlan 70
 description BUH-HR
vlan 80
 description GOV
vlan 90
 description CALLCENTER
vlan 998
 description TRANSIT-to-USERGATE
vlan 999
 description TRANSIT-to-ToR-25G

# ---------- SVI (L3 на ядре) ----------
# USERS = /23 (единственное отступление от 10.10.X.0/24 — 400+ хостов)
dhcp enable
#
interface Vlanif10
 description GW-MGMT
 ip address 10.10.10.1 255.255.255.0
#
interface Vlanif20
 description GW-USERS
 ip address 10.10.20.1 255.255.254.0
 dhcp select relay
 dhcp relay server-ip 10.10.50.10
 dhcp relay server-ip 10.10.50.11
#
interface Vlanif30
 description GW-VOICE
 ip address 10.10.30.1 255.255.255.0
 dhcp select relay
 dhcp relay server-ip 10.10.50.10
 dhcp relay server-ip 10.10.50.11
#
interface Vlanif40
 description GW-WIFI-CORP
 ip address 10.10.40.1 255.255.255.0
 dhcp select relay
 dhcp relay server-ip 10.10.50.10
 dhcp relay server-ip 10.10.50.11
#
interface Vlanif41
 description GW-WIFI-GUEST
 ip address 10.10.41.1 255.255.255.0
 dhcp select relay
 dhcp relay server-ip 10.10.50.10
 dhcp relay server-ip 10.10.50.11
#
interface Vlanif50
 description GW-SERVERS-INFRA
 ip address 10.10.50.1 255.255.255.0
#
interface Vlanif60
 description GW-SERVERS-DEV
 ip address 10.10.60.1 255.255.255.0
 dhcp select relay
 dhcp relay server-ip 10.10.50.10
#
interface Vlanif70
 description GW-BUH-HR
 ip address 10.10.70.1 255.255.255.0
 dhcp select relay
 dhcp relay server-ip 10.10.50.10
 dhcp relay server-ip 10.10.50.11
#
interface Vlanif80
 description GW-GOV
 ip address 10.10.80.1 255.255.255.0
 dhcp select relay
 dhcp relay server-ip 10.10.50.10
#
interface Vlanif90
 description GW-CALLCENTER
 ip address 10.10.90.1 255.255.255.0
 dhcp select relay
 dhcp relay server-ip 10.10.50.10
 dhcp relay server-ip 10.10.50.11
#
interface Vlanif998
 description TRANSIT-to-USERGATE-cluster
 ip address 10.10.254.1 255.255.255.248
#
interface Vlanif999
 description TRANSIT-to-ToR-25G
 ip address 10.10.254.9 255.255.255.248

# ---------- Маршрутизация ----------
# Default — на VIP кластера UserGate (active/standby, VIP следует за active)
ip route-static 0.0.0.0 0.0.0.0 10.10.254.2 description DEFAULT-via-USERGATE-VIP
#
# OSPF area 0: транзиты к периметру (NGFW) и серверному сегменту (ToR).
# NB: в iStack оба ядра — одно логическое устройство, OSPF "между ядрами"
# не нужен; процесс нужен для обмена маршрутами с NGFW и ToR.
ospf 1 router-id 10.10.10.1
 silent-interface all
 undo silent-interface Vlanif998
 undo silent-interface Vlanif999
 area 0.0.0.0
  network 10.10.254.0 0.0.0.7
  network 10.10.254.8 0.0.0.7
  network 10.10.10.0 0.0.0.255
  network 10.10.20.0 0.0.1.255
  network 10.10.30.0 0.0.0.255
  network 10.10.40.0 0.0.0.255
  network 10.10.41.0 0.0.0.255
  network 10.10.50.0 0.0.0.255
  network 10.10.60.0 0.0.0.255
  network 10.10.70.0 0.0.0.255
  network 10.10.80.0 0.0.0.255
  network 10.10.90.0 0.0.0.255

# ---------- Eth-Trunk: uplinks на этажи (2x10G LACP, по линку в каждый member) ----------
# Этаж 1
interface Eth-Trunk1
 description UPLINK-FLOOR1-IDF1 (crm-acc-floor1)
 port link-type trunk
 port trunk allow-pass vlan 10 20 30 40 41 70 80 90
 mode lacp-static
 max active-linknumber 2
 storm-control broadcast min-rate 5000 max-rate 10000
 storm-control multicast min-rate 5000 max-rate 10000
#
interface 10ge 1/0/1
 description FLOOR1-link-A (member1)
 eth-trunk 1
#
interface 10ge 2/0/1
 description FLOOR1-link-B (member2)
 eth-trunk 1
#
# Этаж 2
interface Eth-Trunk2
 description UPLINK-FLOOR2-IDF2 (crm-acc-floor2)
 port link-type trunk
 port trunk allow-pass vlan 10 20 30 40 41 70 80 90
 mode lacp-static
 storm-control broadcast min-rate 5000 max-rate 10000
 storm-control multicast min-rate 5000 max-rate 10000
#
interface 10ge 1/0/2
 description FLOOR2-link-A
 eth-trunk 2
#
interface 10ge 2/0/2
 description FLOOR2-link-B
 eth-trunk 2
#
# Этаж 3
interface Eth-Trunk3
 description UPLINK-FLOOR3-IDF3 (crm-acc-floor3)
 port link-type trunk
 port trunk allow-pass vlan 10 20 30 40 41 70 80 90
 mode lacp-static
 storm-control broadcast min-rate 5000 max-rate 10000
 storm-control multicast min-rate 5000 max-rate 10000
#
interface 10ge 1/0/3
 description FLOOR3-link-A
 eth-trunk 3
#
interface 10ge 2/0/3
 description FLOOR3-link-B
 eth-trunk 3
#
# Этаж 4
interface Eth-Trunk4
 description UPLINK-FLOOR4-IDF4 (crm-acc-floor4)
 port link-type trunk
 port trunk allow-pass vlan 10 20 30 40 41 70 80 90
 mode lacp-static
 storm-control broadcast min-rate 5000 max-rate 10000
 storm-control multicast min-rate 5000 max-rate 10000
#
interface 10ge 1/0/4
 description FLOOR4-link-A
 eth-trunk 4
#
interface 10ge 2/0/4
 description FLOOR4-link-B
 eth-trunk 4
#
# Этаж 5
interface Eth-Trunk5
 description UPLINK-FLOOR5-IDF5 (crm-acc-floor5)
 port link-type trunk
 port trunk allow-pass vlan 10 20 30 40 41 70 80 90
 mode lacp-static
 storm-control broadcast min-rate 5000 max-rate 10000
 storm-control multicast min-rate 5000 max-rate 10000
#
interface 10ge 1/0/5
 description FLOOR5-link-A
 eth-trunk 5
#
interface 10ge 2/0/5
 description FLOOR5-link-B
 eth-trunk 5

# ---------- Линк к периметру: кластер UserGate NGFW ----------
# Каждый NGFW подключён к обоим member'ам стека; транзитный VLAN 998.
interface Eth-Trunk10
 description UPLINK-USERGATE-CLUSTER (ugate-fw-a/b)
 port link-type trunk
 port trunk allow-pass vlan 998
 mode lacp-static
#
interface 10ge 1/0/20
 description USERGATE-FW-A-link1
 eth-trunk 10
#
interface 10ge 1/0/21
 description USERGATE-FW-B-link1
 eth-trunk 10
#
interface 10ge 2/0/20
 description USERGATE-FW-A-link2
 eth-trunk 10
#
interface 10ge 2/0/21
 description USERGATE-FW-B-link2
 eth-trunk 10

# ---------- Серверный сегмент: ToR 25G (2 шт, по 100G в каждый member) ----------
# ToR-01 и ToR-02, каждый к обоим ядрам. 100G; при необходимости —
# breakout 4x25G на стороне ToR.
interface Eth-Trunk20
 description UPLINK-ToR-01-25G-server-segment
 port link-type trunk
 port trunk allow-pass vlan 50 60 999
 mode lacp-static
#
interface 100ge 1/0/1
 description ToR-01-link-A
 eth-trunk 20
#
interface 100ge 2/0/1
 description ToR-01-link-B
 eth-trunk 20
#
interface Eth-Trunk21
 description UPLINK-ToR-02-25G-server-segment
 port link-type trunk
 port trunk allow-pass vlan 50 60 999
 mode lacp-static
#
interface 100ge 1/0/2
 description ToR-02-link-A
 eth-trunk 21
#
interface 100ge 2/0/2
 description ToR-02-link-B
 eth-trunk 21

# ---------- QoS для телефонии (доверие меткам с access-уровня) ----------
# На trunk-портах этажей доверяем DSCP (телефоны метят EF сами)
qos profile QOS-TRUST-DSCP
#
interface Eth-Trunk1
 trust dscp override
interface Eth-Trunk2
 trust dscp override
interface Eth-Trunk3
 trust dscp override
interface Eth-Trunk4
 trust dscp override
interface Eth-Trunk5
 trust dscp override

# ---------- STP ----------
stp mode mstp
stp instance 0 root primary
stp bpdu-protection

# ---------- LLDP / SNMP / NTP / логирование ----------
lldp enable
#
snmp-agent
snmp-agent local-engineid 800007DB03000000000000
snmp-agent sys-info version v2c v3
snmp-agent community read cipher <CHANGE_ME_SNMP_RO> acl 2001
snmp-agent sys-info contact admin@crm.local
snmp-agent sys-info location ServerRoom-1F
snmp-agent target-host trap address udp-domain 10.10.30.11 params securityname <CHANGE_ME_SNMP_RO> v2c
#
ntp-service unicast-server 10.10.50.10
#
info-center loghost 10.10.30.11

# ---------- ACL ----------
# 2000: только MGMT может управлять ядром
acl 2000
 rule 5 permit source 10.10.10.0 0.0.0.255
 rule 100 deny
#
# 2001: SNMP-опрос только с Zabbix
acl 2001
 rule 5 permit source 10.10.30.11 0
 rule 100 deny

# ---------- Управление ----------
aaa
 local-user admin password irreversible-cipher <CHANGE_ME_ADMIN_PWD>
 local-user admin privilege level 15
 local-user admin service-type ssh
quit
#
ssh user admin authentication-type password
stelnet server enable
#
user-interface vty 0 4
 acl 2000 inbound
 authentication-mode aaa
 protocol inbound ssh
quit

# ---------- Служебное ----------
clock timezone MSK add 03:00:00
#
save
y
