# =====================================================================
# access-floorN.cfg — ШАБЛОН этажного стека: 3 x Huawei S5735-L48P4S-A1
# Заменить плейсхолдер FLOOR на номер этажа (1..5):
#   sed 's/FLOOR/1/g' access-floorN.cfg > access-floor1.cfg
# Порядок: секция 1 (iStack) на каждом из трёх свитчей -> reboot ->
# stack-кабели кольцом -> секция 2 на master -> save.
# 48xGE PoE+ + 4x10G SFP+ на каждом member'е.
# =====================================================================

# ---------------------------------------------------------------------
# СЕКЦИЯ 1. iStack (на КАЖДОМ из трёх свитчей изолированно)
#   Свитч A (будет Master):  renumber 1, priority 150
#   Свитч B (Standby):       renumber 2, priority 100
#   Свитч C:                 renumber 3, priority 50
# Стек-кольцо: XGE1/0/3->XGE2/0/4, XGE2/0/3->XGE3/0/4, XGE3/0/3->XGE1/0/4
# Пример для свитча A (для B/C поменять member id и priority):
# ---------------------------------------------------------------------
system-view
sysname crm-acc-floorFLOOR
stack
 stack member 1 renumber 1 inherit-config   # B: 2 ; C: 3
 stack member 1 priority 150                # B: 100 ; C: 50
 stack member 1 domain 20
quit
interface stack-port 1/1
 port member-group interface xgigabitethernet 1/0/3 to 1/0/4
quit
save
y
# reboot -> y

# =====================================================================
# СЕКЦИЯ 2. ОБЩИЙ КОНФИГ СТЕКА (заливать на master после display stack)
# =====================================================================
system-view
sysname crm-acc-floorFLOOR

# ---------- VLAN ----------
vlan batch 10 20 30 40 41 70 80 90
#
vlan 10
 description MGMT
vlan 20
 description USERS
vlan 30
 description VOICE
vlan 40
 description WIFI-CORP
vlan 41
 description WIFI-GUEST
vlan 70
 description BUH-HR
vlan 80
 description GOV
vlan 90
 description CALLCENTER

# ---------- Управление стеком (SVI в MGMT) ----------
interface Vlanif10
 description MGMT-floorFLOOR
 ip address 10.10.10.1FLOOR 255.255.255.0   # этаж 1 -> .11, этаж 2 -> .12 ...
#
ip route-static 0.0.0.0 0.0.0.0 10.10.10.1 description GW-core

# ---------- Uplink к ядру: Eth-Trunk 2x10G LACP, по линку в каждое ядро ----------
# XGE1/0/1 -> core member 1 (crm-core-01), XGE2/0/1 -> core member 2 (crm-core-02)
interface Eth-Trunk1
 description UPLINK-CORE-STACK (Eth-TrunkFLOOR на ядре)
 port link-type trunk
 port trunk allow-pass vlan 10 20 30 40 41 70 80 90
 mode lacp-static
 storm-control broadcast min-rate 5000 max-rate 10000
 storm-control multicast min-rate 5000 max-rate 10000
#
interface xgigabitethernet 1/0/1
 description UPLINK-core-member1
 eth-trunk 1
 stp disable
#
interface xgigabitethernet 2/0/1
 description UPLINK-core-member2
 eth-trunk 1
 stp disable

# ---------- Access-порты: ПК + IP-телефон (каскадом через телефон) ----------
# Шаблон: untagged VLAN 20 (USERS) + voice VLAN 30. PoE для телефона.
# Диапазон GE x/0/1 - x/0/40 на каждом member (x = 1..3)
port-group group-member gigabitethernet 1/0/1 to gigabitethernet 1/0/40 gigabitethernet 2/0/1 to gigabitethernet 2/0/40 gigabitethernet 3/0/1 to gigabitethernet 3/0/40
 description USER-PORTS-PC+PHONE
 port link-type hybrid
 port hybrid pvid vlan 20
 port hybrid untagged vlan 20
 voice-vlan 30 enable
 voice-vlan legacy enable
 stp edged-port enable
 storm-control broadcast min-rate 3000 max-rate 8000
 storm-control multicast min-rate 3000 max-rate 8000
 storm-control unicast min-rate 8000 max-rate 16000
 port-security enable
 port-security max-mac-num 3
 port-security protect-action restrict
 dhcp snooping enable
 quit

# ---------- Порты точек доступа Wi-Fi (UniFi U7 Pro) ----------
# GE x/0/41 - x/0/46: management ТД untagged в MGMT(10), клиентские SSID tagged 40/41
port-group group-member gigabitethernet 1/0/41 to gigabitethernet 1/0/46 gigabitethernet 2/0/41 to gigabitethernet 2/0/46 gigabitethernet 3/0/41 to gigabitethernet 3/0/46
 description AP-PORTS-UniFi
 port link-type hybrid
 port hybrid pvid vlan 10
 port hybrid untagged vlan 10
 port hybrid tagged vlan 40 41
 stp edged-port enable
 storm-control broadcast min-rate 3000 max-rate 8000
 storm-control multicast min-rate 3000 max-rate 8000
 quit

# ---------- Резерв/принтеры/СКУД: GE x/0/47-48 — доступ в USERS без voice ----------
port-group group-member gigabitethernet 1/0/47 to gigabitethernet 1/0/48 gigabitethernet 2/0/47 to gigabitethernet 2/0/48 gigabitethernet 3/0/47 to gigabitethernet 3/0/48
 description MISC-PORTS-printer-SKUD
 port link-type access
 port default vlan 20
 stp edged-port enable
 port-security enable
 port-security max-mac-num 2
 port-security protect-action shutdown
 dhcp snooping enable
 quit

# ---------- PoE (телефоны + ТД) ----------
# S5735-L48P4S-A1: PoE+ на всех GE, включён по умолчанию; задаём явно + приоритет ТД
port-group group-member gigabitethernet 1/0/1 to gigabitethernet 1/0/46 gigabitethernet 2/0/1 to gigabitethernet 2/0/46 gigabitethernet 3/0/1 to gigabitethernet 3/0/46
 poe enable
 quit
# Проверка бюджета: display poe power-state / display poe-power

# ---------- DHCP snooping ----------
dhcp enable
dhcp snooping enable
vlan 20
 dhcp snooping enable
vlan 70
 dhcp snooping enable
vlan 80
 dhcp snooping enable
vlan 90
 dhcp snooping enable
# Trusted — только uplink к ядру (там DHCP relay)
interface Eth-Trunk1
 dhcp snooping trusted
# Опционально: защита от поддельного DHCP-ответа с access-портов — НЕ trusted по умолчанию, ok.
# Опционально DAI/IPSG (включать после стабилизации):
# user-bind static ... / arp dhcp-snooping-detect enable

# ---------- STP ----------
stp mode mstp
stp bpdu-protection
stp root-protection          # на Eth-Trunk1 НЕ применять (там корень) — только access
# NB: root-protection на uplink не вешать! Edged-port уже задан на access.

# ---------- LLDP (для телефонов/ТД и диагностики) ----------
lldp enable

# ---------- SNMP -> Zabbix (10.10.30.11) ----------
snmp-agent
snmp-agent sys-info version v2c
snmp-agent community read cipher <CHANGE_ME_SNMP_RO> acl 2001
snmp-agent sys-info contact admin@crm.local
snmp-agent sys-info location IDF-floorFLOOR
snmp-agent target-host trap address udp-domain 10.10.30.11 params securityname <CHANGE_ME_SNMP_RO> v2c

# ---------- NTP ----------
ntp-service unicast-server 10.10.50.10
clock timezone MSK add 03:00:00

# ---------- ACL: управление и SNMP только из MGMT ----------
acl 2000
 rule 5 permit source 10.10.10.0 0.0.0.255
 rule 100 deny
#
acl 2001
 rule 5 permit source 10.10.30.11 0
 rule 100 deny

# ---------- Доступ к управлению (только SSH, только из MGMT) ----------
aaa
 local-user admin password irreversible-cipher <CHANGE_ME_ADMIN_PWD>
 local-user admin privilege level 15
 local-user admin service-type ssh
quit
ssh user admin authentication-type password
stelnet server enable
user-interface vty 0 4
 acl 2000 inbound
 authentication-mode aaa
 protocol inbound ssh
quit

# ---------- Готово ----------
save
y
