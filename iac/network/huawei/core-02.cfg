# =====================================================================
# crm-core-02 — Huawei S6730-H24X6C — iStack STANDBY (member 2)
# ВНИМАНИЕ: в iStack конфигурация ОБЩАЯ. На этом свитче выполняется
# ТОЛЬКО секция iStack ниже (до образования стека). После того как
# стек собран и core-01 стал Master, вся секция 2 из core-01.cfg уже
# действует на обоих шасси — повторно заливать её НЕ нужно.
# =====================================================================

# ---------------------------------------------------------------------
# iStack — на изолированном core-02, ДО подключения stack-кабелей
# ---------------------------------------------------------------------
system-view
sysname crm-core-stack
#
stack
 stack member 1 renumber 2 inherit-config   # этот свитч станет member 2
 stack member 2 priority 100                # ниже приоритет -> Standby
 stack member 2 domain 10                   # domain совпадает с core-01
quit
#
interface stack-port 2/1
 port member-group interface 100ge 2/0/5 to 2/0/6
quit
save
y
# reboot -> y
#
# После reboot:
# 1. Соединить кроссом: 100GE1/0/5 <-> 100GE2/0/5, 100GE1/0/6 <-> 100GE2/0/6
# 2. Проверить на core-01 (master):
#      display stack
#    Ожидаем: MemberID 1 = Master (priority 150), MemberID 2 = Standby (100)
# 3. Залить секцию 2 из core-01.cfg на master (если ещё не залита).
# 4. save на master — синхронизируется на оба шасси.
#
# Отличия от core-01.cfg — только: renumber 2, priority 100, stack-port 2/1.
# Всё остальное (VLAN, SVI, OSPF, Eth-Trunk, SNMP...) — общее, см. core-01.cfg.
# =====================================================================
